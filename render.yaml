services:
  - type: web
    name: molecular-prediction-suite
    plan: starter
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: RENDER
        value: "true"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_THEME_BASE
        value: "light"
      - key: STREAMLIT_THEME_PRIMARY_COLOR
        value: "#007AFF"
      - key: PYTHONUNBUFFERED
        value: "1"
    buildCommand: echo "Building with Docker..."
